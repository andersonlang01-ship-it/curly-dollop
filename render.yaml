services:
  - type: web
    name: website-backend
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: website-db
          property: connectionString

databases:
  - name: website-db
    plan: free
